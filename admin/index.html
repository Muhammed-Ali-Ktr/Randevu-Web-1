<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | Kuaför Vadık</title>

  <!-- CSS Dosyaları -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Header Area -->
    <header class="app-header">
      <div class="brand-logo-wrapper" style="margin-top: 20px;">
        <img src="../assets/img/logo.svg" alt="İşletme Logo" class="brand-logo">
      </div>
      <div class="header-titles">
        <h1 class="header-title business-name">Kuaför Vadık</h1>
        <p class="header-subtitle">Yönetici Paneli Girişi</p>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-content">
      
      <div class="login-card">
        <h2 class="login-title">Giriş Yap</h2>
        <p class="login-subtitle">Randevu paneline erişmek için şifrenizi giriniz</p>

        <form id="admin-login-form">
          <div class="input-group" style="margin-bottom: 20px;">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <div class="input-content">
              <label for="admin-password" class="input-label">Yönetici Şifresi</label>
              <input type="password" id="admin-password" class="input-field" placeholder="••••••••" required autofocus>
            </div>
          </div>

          <div id="login-error" style="display: none; color: var(--accent-red); font-size: 0.8rem; margin-bottom: 16px; font-weight: 600; text-align: center;"></div>

          <button type="submit" class="btn-primary">
            Giriş Yap
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          </button>
        </form>
      </div>

    </main>

  </div>

  <!-- Supabase & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
